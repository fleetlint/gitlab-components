name: test
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./test/run.sh
      - name: A tag installs the fleetlint release of its name
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for t in templates/*.yml; do
            test "$(awk '/^---$/ {exit} {print}' "$t" | yq .spec.inputs.version.default)" = "v$TAG"
          done
