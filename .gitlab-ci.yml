# Tests the components on GitLab and publishes a version tag to the CI/CD catalog.
include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/fleetlint@$CI_COMMIT_SHA
    inputs:
      fail-on: never

stages: [test, release]

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  # The notes are the tag's section of CHANGELOG.md.
  script:
    - awk -v v="$CI_COMMIT_TAG" '/^## \[/ {p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
    - test -s notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    description: ./notes.md
