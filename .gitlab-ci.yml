# Tests the components on GitLab and publishes a version tag to the CI/CD catalog.
include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/check@$CI_COMMIT_SHA
    inputs:
      fail-on: never
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/pr@$CI_COMMIT_SHA

stages: [test, release]

# Included to validate it; it would open merge requests on this project.
fleetlint-pr:
  rules:
    - when: never

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script: echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: fleetlint components $CI_COMMIT_TAG; they install fleetlint v$CI_COMMIT_TAG.
